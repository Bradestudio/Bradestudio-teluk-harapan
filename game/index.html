<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TELUK HARAPAN — Open World Kota Pesisir</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Dibaca pembaca layar, tidak ditampilkan: status permainan. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="TELUK HARAPAN: game open-world kota pesisir Indonesia. Jelajahi kota dengan berjalan kaki atau mobil, selesaikan 5 misi cerita dalam 3 hari, dan hindari polisi."></canvas>
<p id="status" role="status" aria-live="polite">TELUK HARAPAN sedang dimuat.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
