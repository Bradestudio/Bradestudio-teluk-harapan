<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teluk Harapan — Open-World Crime 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f22; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hud { position: fixed; color: #eef1f5; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; z-index: 5; }
  #hud-topleft { top: 14px; left: 16px; font-size: 20px; line-height: 1.5; }
  #hud-money { font-weight: 800; font-size: 26px; color: #7ddc7d; }
  #hud-hpbar-wrap { width: 180px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid #555; margin-top: 4px; }
  #hud-hpbar { height: 100%; width: 100%; background: #e84d3d; }
  #hud-wanted { color: #ffd34d; letter-spacing: 2px; font-size: 22px; }
  #hud-topcenter { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 17px; }
  #hud-day { font-weight: 700; color: #ffd34d; }
  #hud-mission { margin-top: 2px; font-size: 15px; color: #cfe3ff; }
  #hud-district { font-size: 13px; color: #9aa3b2; }
  #minimap { position: fixed; top: 14px; right: 16px; width: 180px; height: 180px; border: 2px solid rgba(255,255,255,.35); background: #14161c; z-index: 5; }
  #hud-bottomleft { bottom: 16px; left: 16px; font-size: 18px; }
  #hud-speed { font-weight: 700; }
  #hud-msg { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; color: #ffd34d; text-shadow: 0 1px 4px rgba(0,0,0,.9); z-index: 5; pointer-events: none; }
  #hud-banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
  #hud-banner .panel { background: rgba(10, 14, 28, 0.88); border: 1px solid #4a5568; border-radius: 12px; padding: 28px 40px; max-width: 640px; text-align: center; color: #eef1f5; }
  #hud-banner h1 { margin: 0 0 10px; font-size: 42px; letter-spacing: 3px; color: #ffd34d; }
  #hud-banner p { margin: 8px 0; font-size: 16px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="game" aria-label="Teluk Harapan: open-world crime 3D. WASD jalan dan nyetir, E masuk mobil, F pukul, klik tembak."></canvas>
<div class="hud" id="hud-topleft">
  <div id="hud-money">$100</div>
  <div id="hud-hp">❤ 100</div>
  <div id="hud-hpbar-wrap"><div id="hud-hpbar"></div></div>
  <div id="hud-wanted">☆☆☆☆☆</div>
</div>
<div class="hud" id="hud-topcenter">
  <div id="hud-day">Hari 1 — Senja</div>
  <div id="hud-mission"></div>
  <div id="hud-district"></div>
</div>
<canvas id="minimap" width="180" height="180" aria-label="Minimap"></canvas>
<div class="hud" id="hud-bottomleft"><span id="hud-speed"></span> <span id="hud-ammo"></span></div>
<div id="hud-msg"></div>
<div id="hud-banner"><div class="panel" id="hud-banner-panel"></div></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
